
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskHub | My Tasks</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>TaskHub - My Tasks</h1>
        <p>Organize and track your daily activities.</p>
    </header>

    <nav>
        <a href="dashboard.html">Dashboard</a> |
        <a href="tasks.html">My Tasks</a> |
        <a href="index.html">Logout</a>
    </nav>

    <main>

        <section class="task-form-section">
            <h2>Add a New Task</h2>

            <form id="taskForm">

                <label for="taskTitle">Task Title</label>
                <input
                    type="text"
                    id="taskTitle"
                    placeholder="Enter task title"
                    required
                >

                <label for="description">Description</label>
                <textarea
                    id="description"
                    placeholder="Describe your task"
                ></textarea>

                <label for="priority">Priority</label>
                <select id="priority">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>

                <label for="deadline">Deadline</label>
                <input type="date" id="deadline">

                <button type="submit" id="submitTaskButton">Add Task</button>
                <button type="button" id="cancelEditButton" style="display: none;">
                    Cancel Edit
                </button>

            </form>
        </section>

        <section class="task-list-section">
            <h2>My Task List</h2>

            <div class="task-sort">
                <label for="sortPriority">Sort by Priority:</label>
                <select id="sortPriority">
                    <option value="default">Default Order</option>
                    <option value="high">High to Low</option>
                    <option value="low">Low to High</option>
                </select>
            </div>
            <div class="task-search">
                <input
                    type="text"
                    id="searchTask"
                    placeholder="Search tasks by title..."
                >
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Task</th>
                        <th>Priority</th>
                        <th>Deadline</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="taskList">
                    <tr>
                        <td colspan="5">No tasks available yet.</td>
                    </tr>
                </tbody>
            </table>
        </section>

        <p class="back-link">
            <a href="dashboard.html">Back to Dashboard</a>
        </p>

    </main>

    <footer>
        <p>TaskHub - M.Tech Cloud Computing Project</p>
    </footer>

    <script src="js/tasks.js"></script>

</body>
</html>
